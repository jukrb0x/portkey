<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Portkey v0.1 connection diagram</title><desc id="desc">Mac connects to a shared monitor via HDMI and Windows via DisplayPort. Both hosts connect by USB to a physical USB switch carrying the shared USB2 and USB3 hubs, keyboard and mouse. Portkey runs on the Mac and sends display input commands via HDMI.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1440" height="960" rx="24" fill="#F6F8FC" stroke="none" stroke-width="1"/><text x="64" y="77" font-size="43" font-weight="700" fill="#142333" >How your desk connects</text><text x="64" y="120" font-size="23" font-weight="400" fill="#526579" >Both hosts stay connected to the monitor. The USB switch selects the peripherals.</text><path d="M64 163 H104" fill="none" stroke="#277BC4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="116" y="170" font-size="20" font-weight="500" fill="#526579" >Video</text><path d="M260 163 H300" fill="none" stroke="#CB7133" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="312" y="170" font-size="20" font-weight="500" fill="#526579" >USB</text><path d="M450 163 H490" fill="none" stroke="#3F7B6A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="502" y="170" font-size="20" font-weight="500" fill="#526579" >DDC control</text><path d="M376 330 H484 V257 H560" fill="none" stroke="#277BC4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1064 330 H956 V257 H880" fill="none" stroke="#277BC4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="410" y="249" font-size="20" font-weight="600" fill="#246AA6" >HDMI</text><text x="983" y="249" font-size="20" font-weight="600" fill="#246AA6" >DisplayPort</text><path d="M376 365 H515 V302 H552" fill="none" stroke="#3F7B6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M543 294 L554 302 L543 310" fill="none" stroke="#3F7B6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M240 422 V640 H560" fill="none" stroke="#CB7133" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1200 422 V640 H880" fill="none" stroke="#CB7133" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="313" y="624" font-size="20" font-weight="500" fill="#9C5427" >USB host cable</text><text x="947" y="624" font-size="20" font-weight="500" fill="#9C5427" >USB host cable</text><path d="M720 720 V810" fill="none" stroke="#CB7133" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="104" y="257" width="272" height="165" rx="18" fill="#FFFFFF" stroke="#CED9E6" stroke-width="2"/><text x="240" y="314" font-size="32" font-weight="650" fill="#142333" text-anchor="middle">Mac</text><text x="240" y="353" font-size="20" font-weight="400" fill="#526579" text-anchor="middle">Portkey runs here</text><rect x="167" y="374" width="146" height="28" rx="14" fill="#E6F2ED" stroke="none" stroke-width="1"/><text x="240" y="394" font-size="15" font-weight="600" fill="#366D5C" text-anchor="middle">DDC commands</text><rect x="1064" y="257" width="272" height="165" rx="18" fill="#FFFFFF" stroke="#CED9E6" stroke-width="2"/><text x="1200" y="314" font-size="32" font-weight="650" fill="#142333" text-anchor="middle">Windows</text><text x="1200" y="353" font-size="20" font-weight="400" fill="#526579" text-anchor="middle">No software needed</text><rect x="560" y="218" width="320" height="205" rx="18" fill="#1C2F45" stroke="none" stroke-width="1"/><rect x="573" y="231" width="294" height="175" rx="8" fill="#E6EFF9" stroke="none" stroke-width="1"/><text x="720" y="291" font-size="29" font-weight="650" fill="#142333" text-anchor="middle">Shared monitor</text><text x="720" y="329" font-size="21" font-weight="400" fill="#526579" text-anchor="middle">Mac → HDMI 1</text><text x="720" y="364" font-size="21" font-weight="400" fill="#526579" text-anchor="middle">Windows → DisplayPort</text><rect x="698" y="423" width="44" height="29" rx="3" fill="#1C2F45" stroke="none" stroke-width="1"/><rect x="647" y="450" width="146" height="7" rx="3" fill="#586C82" stroke="none" stroke-width="1"/><text x="720" y="503" font-size="20" font-weight="500" fill="#366D5C" text-anchor="middle">Portkey selects the input via the Mac’s HDMI connection.</text><rect x="560" y="575" width="320" height="145" rx="22" fill="#FFFFFF" stroke="#D5B497" stroke-width="2"/><text x="720" y="617" font-size="29" font-weight="650" fill="#142333" text-anchor="middle">USB switch</text><text x="720" y="649" font-size="19" font-weight="400" fill="#526579" text-anchor="middle">Shared USB2 + USB3 hubs</text><rect x="665" y="671" width="110" height="28" rx="14" fill="#FCEDDF" stroke="none" stroke-width="1"/><text x="720" y="691" font-size="15" font-weight="650" fill="#9C5427" text-anchor="middle" letter-spacing="2">PRESS</text><rect x="500" y="810" width="440" height="73" rx="16" fill="#FFFFFF" stroke="#CED9E6" stroke-width="2"/><text x="720" y="855" font-size="25" font-weight="550" fill="#142333" text-anchor="middle">Shared keyboard + mouse</text><text x="64" y="926" font-size="21" font-weight="400" fill="#526579" >Portkey observes hub ownership on the Mac and requests the matching display input.</text></g></svg>

[package]
name = "portkey"
version = "1.0.2"
edition = "2021"
description = "A local USB-switch companion for explicitly enrolled displays"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
plist = "1"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"] }

[[bin]]
name = "portkey-helper"
path = "native/windows/helper.rs"

[package]
name = "portkey"
version = "0.2.0"
edition = "2021"
description = "A local USB-switch companion for explicitly enrolled displays"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
plist = "1"
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "accesskit", "glow", "x11", "wayland"] }

[profile.release]
lto = "thin"
strip = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.19.2"
